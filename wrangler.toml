name = "gdjylt"
main = "dist/index.js"
compatibility_date = "2026-10-01"

# 一键部署时 Cloudflare 会自动创建 D1 并回填 database_id
# 手动部署时把下面改成你自己的 database_id
[[d1_databases]]
binding = "DB"
database_name = "gdjylt"
database_id = "2ca219f8-2030-422a-9a10-1b7f934ce28c"
migrations_dir = "migrations"

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAF2Ooc_mFE54Me_Z"
FROM_EMAIL = "noreply@example.com"

# 静态资源：public/ 目录下的文件（全屏背景图等）由 Cloudflare 静态层直出，
# 其余路由仍交给 Worker（not_found_handling=none 表示未命中资源时回落到 Worker）
[assets]
directory = "./public"
not_found_handling = "none"

# AI 每日精选定时任务（每 6 小时一轮；还需把 AI_API_KEY 设为 Worker Secret）
[triggers]
crons = ["23 */6 * * *"]
