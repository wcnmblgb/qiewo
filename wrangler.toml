name = "gdjylt"
main = "dist/index.js"
compatibility_date = "2026-10-01"

# 一键部署时 Cloudflare 会自动创建 D1 并回填 database_id
# 手动部署时把下面改成你自己的 database_id
[[d1_databases]]
binding = "DB"
database_name = "gdjyltsql"
database_id = "2ca219f8-2030-422a-9a10-1b7f934ce28c"
migrations_dir = "migrations"

[vars]
TURNSTILE_SITE_KEY = ""
JWT_SECRET = "gdjy_forum_secret_key_2026_Lll38139_12Z"

# AI 每日精选定时任务（每 6 小时一轮；还需把 AI_API_KEY 设为 Worker Secret）
[triggers]
crons = ["23 */6 * * *"]
